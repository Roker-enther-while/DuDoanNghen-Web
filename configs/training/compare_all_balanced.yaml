seed: 42
epochs: 20
batch_size: 128
learning_rate: 0.001
max_train_samples:
max_val_samples:
max_test_samples:
alert_threshold:
  mode: quantile
  reference_split: val
  value: 0.90
output_dir: outputs
output_tag: balanced
backend: torch
require_gpu: true
early_stopping: true
patience: 5
reduce_lr_on_plateau: true
model_checkpoint: true
csv_logger: true
mixed_precision: true
gpu_memory_limit_mb: 5120
gpu_data_buffer_mb: 1024
gpu_model_budget_mb: 4096
verbose: 1
evaluation_sample_strategy: full
average_steps: 5
d_model: 64
num_heads: 4
ff_dim: 128
num_blocks: 2
filters: 64
kernel_size: 3
dilations: [1, 2, 4, 8]
attention_heads: 4
attention_key_dim: 16
lstm_units: 64
dense_units: 64
dropout: 0.1
models:
  - naive_last_value
  - moving_average
  - lstm
  - gru
  - tcn
  - transformer
  - tcn_lstm
  - tcn_attention_bilstm
