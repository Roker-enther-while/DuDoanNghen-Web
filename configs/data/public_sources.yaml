sources:
  - source_id: nasa_http_1995
    source_name: NASA Kennedy Space Center HTTP Server Logs
    source_type: real_web_log
    enabled: true
    original_url: https://ita.ee.lbl.gov/html/contrib/NASA-HTTP.html
    mirror_url: ""
    citation: "Arlitt, M. and Williamson, C. Web Server Workload Characterization: The Search for Invariants. ACM SIGMETRICS, 1996. NASA-HTTP traces via Internet Traffic Archive."
    license_name: Internet Traffic Archive redistributable trace permission
    license_url: https://ita.ee.lbl.gov/html/contrib/NASA-HTTP.html
    allowed_use:
      research: true
      redistribution: true
      derived_features: true
      commercial: false
    restrictions:
      - "Originating host and HTTP request are preserved in raw logs."
      - "Do not analyze beyond general traffic patterns."
      - "Do not publish raw host/request logs from this project."
    requires_attribution: true
    contains_personal_data_risk: medium
    pii_handling:
      - hash_ip
      - drop_query_string
      - no_raw_release
    raw_download_default: true
    notes: "Small default public web-log source. Raw logs include host/request privacy risk; processed outputs should remain aggregated."

  - source_id: zanbil_web_logs
    source_name: Online Shopping Store Web Server Logs / Zanbil
    source_type: real_web_log
    enabled: true
    original_url: https://doi.org/10.7910/DVN/3QBYB5
    mirror_url: https://www.kaggle.com/datasets/eliasdabbas/web-server-access-logs
    citation: "Zaker, Farzin, 2019, Online Shopping Store - Web Server Logs, Harvard Dataverse, V1, https://doi.org/10.7910/DVN/3QBYB5"
    license_name: CC0-1.0 Public Domain Dedication
    license_url: https://creativecommons.org/publicdomain/zero/1.0/
    allowed_use:
      research: true
      redistribution: true
      derived_features: true
      commercial: true
    restrictions:
      - "Large raw access.log is not downloaded automatically."
      - "Hash client identifiers and strip query strings before processed release."
    requires_attribution: false
    contains_personal_data_risk: medium
    pii_handling:
      - hash_ip
      - drop_user_agent
      - drop_query_string
      - no_raw_release
    raw_download_default: false
    notes: "3GB+ Nginx web access log; user must place an authorized local copy under data/raw/zanbil/access.log."

